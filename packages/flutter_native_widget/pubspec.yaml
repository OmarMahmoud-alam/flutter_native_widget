version: 0.1.0
publish_to: none
repository: https://github.com/OmarMahmoud-alam/flutter_native_widget/tree/main/packages/flutter_native_widget
issue_tracker: https://github.com/OmarMahmoud-alam/flutter_native_widget/issues

environment:
  sdk: ^3.10.0
  flutter: ">=3.38.1"

dependencies:
  flutter:
    sdk: flutter
  home_widget: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

topics:
  - home-screen-widget
  - widgetkit
  - code-generation
