name: flutter_native_widget_gen
description: build_runner generator and CLI for flutter_native_widget. Turns @HomeScreenWidget declarations into RemoteViews (Android) and WidgetKit (iOS) code.
version: 0.1.0
publish_to: none
repository: https://github.com/OmarMahmoud-alam/flutter_native_widget/tree/main/packages/flutter_native_widget_gen
issue_tracker: https://github.com/OmarMahmoud-alam/flutter_native_widget/issues

environment:
  sdk: ^3.10.0

executables:
  flutter_native_widget_gen: flutter_native_widget_gen
dependencies:
  analyzer: ^14.7.0
  args: ^2.7.0
  build: ^5.0.0
  dart_style: ^3.1.14
  glob: ^2.2.0
  path: ^1.9.1
  yaml: ^3.1.4
dev_dependencies:
  build_test: ^3.5.23
  lints: ^6.1.0
  test: ^1.33.0
